<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Island Settlers — Prototip</title><style>body{margin:0;background:#102d2b;color:#f6e7c2;font:15px system-ui}header{padding:12px 18px;background:#183d38;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}button{background:#caa75a;color:#172b26;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.35}main{display:flex;gap:14px;padding:12px;max-width:1200px;margin:auto;flex-wrap:wrap}#board{background:radial-gradient(#267d8a,#164b60);border:9px solid #a7783c;border-radius:25px;max-width:100%;touch-action:manipulation}aside{flex:1;min-width:260px}section{background:#1d4540;border:1px solid #8c784a;border-radius:12px;padding:12px;margin-bottom:10px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{padding:9px;border-radius:8px;background:#12332e}.active{outline:2px solid #e7c875}.resources{font-size:13px;line-height:1.9}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{padding:9px}#log{height:120px;overflow:auto;font-size:13px;color:#e5d9b7}small{color:#d7c9a7}h2{margin:0 0 9px;font-size:18px}</style></head><body><header><b>🏝️ ISLAND SETTLERS · CATAN STYLE</b><div><label>Fitore: <select id="target"><option>10</option><option selected>12</option></select> pikë</label> <button onclick="restart()">Lojë e re</button></div></header><main><canvas id="board" width="720" height="700"></canvas><aside><section><h2>Lojtarët</h2><div class="players" id="players"></div></section><section><h2 id="turn"></h2><div id="status"></div><p id="dice"></p><div class="actions"><button id="roll" onclick="rollDice()">🎲 Hidh zaret</button><button onclick="mode='road';draw()">🛤️ Rrugë</button><button onclick="mode='settlement';draw()">🏠 Fshat</button><button onclick="mode='city';draw()">🏰 Qytet</button><button onclick="trade()">🔄 Tregti 4:1</button><button onclick="endTurn()">Kalo radhën →</button></div><p><small>Kliko nyjet për fshatra/qytete dhe vijat për rrugë. Në fazën e vendosjes, ndërto falas 2 fshatra dhe 2 rrugë për lojtar.</small></p></section><section><h2>Ngjarjet</h2><div id="log"></div></section></aside></main><script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');const colors=['#e75b52','#3c8de5','#f0cc51','#e8e8e8'];const names=['Ardit','Mondi','Albi','Endri'];const types=['forest','pasture','field','hill','mountain','desert'];const fill={forest:'#347b47',pasture:'#91b95b',field:'#e9c56a',hill:'#bb6a48',mountain:'#85918d',desert:'#d9bd82'};const emoji={forest:'🌲',pasture:'🐑',field:'🌾',hill:'🧱',mountain:'⛰️',desert:'🏜️'};let tiles=[],vertices=[],edges=[],players=[],current=0,phase='setup',setupStep=0,rolled=false,mode='settlement',robber=0,history=[];const S=64,CX=355,CY=342;const key=(x,y)=>`${Math.round(x*10)},${Math.round(y*10)}`;function shuffle(a){return a.sort(()=>Math.random()-.5)}function makeBoard(){tiles=[];vertices=[];edges=[];let vmap=new Map(),emap=new Map();let resources=shuffle(['forest','forest','forest','forest','pasture','pasture','pasture','pasture','field','field','field','field','hill','hill','hill','mountain','mountain','mountain','desert']);let nums=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);let ni=0;for(let q=-2;q<=2;q++)for(let r=Math.max(-2,-q-2);r<=Math.min(2,-q+2);r++){let x=CX+S*Math.sqrt(3)*(q+r/2),y=CY+S*1.5*r,t={x,y,q,r,type:resources[tiles.length],vs:[]};t.num=t.type==='desert'?0:nums[ni++];for(let i=0;i<6;i++){let a=Math.PI/180*(60*i-30),px=x+S*Math.cos(a),py=y+S*Math.sin(a),k=key(px,py),id;if(vmap.has(k))id=vmap.get(k);else{id=vertices.length;vertices.push({x:px,y:py,owner:-1,level:0,neighbors:[],tiles:[]});vmap.set(k,id)}t.vs.push(id);vertices[id].tiles.push(tiles.length)}for(let i=0;i<6;i++){let a=t.vs[i],b=t.vs[(i+1)%6],k=[a,b].sort((x,y)=>x-y).join('-');if(!emap.has(k)){emap.set(k,edges.length);edges.push({a,b,owner:-1});vertices[a].neighbors.push(b);vertices[b].neighbors.push(a)}}tiles.push(t)}robber=tiles.findIndex(t=>t.type==='desert')}
function restart(){players=names.map((name,i)=>({name,color:colors[i],res:{forest:0,pasture:0,field:0,hill:0,mountain:0},vp:0,roads:0}));current=0;phase='setup';setupStep=0;rolled=false;mode='settlement';history=[];makeBoard();say('Vendosja fillestare: secili vendos 2 fshatra dhe 2 rrugë.');draw()}
function say(s){history.unshift(s);history=history.slice(0,35)}function polygon(x,y,r){ctx.beginPath();for(let i=0;i<6;i++){let a=Math.PI/180*(60*i-30);i?ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a)):ctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a))}ctx.closePath()}
function draw(){ctx.clearRect(0,0,720,700);for(let [i,t] of tiles.entries()){polygon(t.x,t.y,S-3);ctx.fillStyle=fill[t.type];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#f2d397';ctx.stroke();ctx.font='31px serif';ctx.textAlign='center';ctx.fillText(emoji[t.type],t.x,t.y-13);if(t.num){ctx.beginPath();ctx.arc(t.x,t.y+18,20,0,7);ctx.fillStyle='#fff0cf';ctx.fill();ctx.fillStyle=[6,8].includes(t.num)?'#bb332a':'#27352d';ctx.font='bold 22px system-ui';ctx.fillText(t.num,t.x,t.y+26)}if(i===robber){ctx.font='28px serif';ctx.fillText('♟️',t.x+30,t.y-25)}}for(let e of edges){if(e.owner<0)continue;let a=vertices[e.a],b=vertices[e.b];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=10;ctx.strokeStyle='#1e2727';ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=colors[e.owner];ctx.stroke()}for(let v of vertices){if(v.owner<0)continue;ctx.fillStyle=colors[v.owner];ctx.strokeStyle='#172b26';ctx.lineWidth=3;ctx.beginPath();if(v.level===2){ctx.rect(v.x-11,v.y-12,22,23)}else{ctx.moveTo(v.x-11,v.y+9);ctx.lineTo(v.x-11,v.y-3);ctx.lineTo(v.x,v.y-13);ctx.lineTo(v.x+11,v.y-3);ctx.lineTo(v.x+11,v.y+9);ctx.closePath()}ctx.fill();ctx.stroke()}document.getElementById('players').innerHTML=players.map((p,i)=>`<div class="player ${i===current?'active':''}"><b style="color:${p.color}">● ${p.name}</b> — ${p.vp} VP<div class="resources">🌲${p.res.forest} 🐑${p.res.pasture} 🌾${p.res.field}<br>🧱${p.res.hill} ⛰️${p.res.mountain}</div></div>`).join('');document.getElementById('turn').textContent=`Radha: ${players[current].name}`;document.getElementById('status').textContent=phase==='setup'?`Vendosja ${setupStep+1}/8 · ${mode==='road'?'Zgjidh vijën për rrugën':'Zgjidh nyjen për fshatin'}`:phase==='finished'?'Loja përfundoi':`Veprimi: ${mode} · ${rolled?'Zaret u hodhën':'Hidh zaret përpara ndërtimit'}`;document.getElementById('roll').disabled=phase!=='play'||rolled;document.getElementById('log').innerHTML=history.map(x=>`<div>• ${x}</div>`).join('')}
function dist(x,y,a,b){let dx=b.x-a.x,dy=b.y-a.y;return Math.hypot(x-(a.x+Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy))))*dx),y-(a.y+Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy))))*dy))}function afford(cost){return Object.entries(cost).every(([k,n])=>players[current].res[k]>=n)}function pay(cost){for(let [k,n] of Object.entries(cost))players[current].res[k]-=n}function connected(v){return edges.some(e=>e.owner===current&&(e.a===v||e.b===v))}function canRoad(e){return vertices[e.a].owner===current||vertices[e.b].owner===current||connected(e.a)||connected(e.b)}function setupAdvance(){if(mode==='settlement'){mode='road'}else{setupStep++;if(setupStep===8){phase='play';current=0;rolled=false;mode='road';say('Filloi loja! Hidh zaret.')}else{current=setupStep<4?setupStep:7-setupStep;mode='settlement'}}}function clickBoard(ev){if(phase==='finished')return;let rect=canvas.getBoundingClientRect(),x=(ev.clientX-rect.left)*720/rect.width,y=(ev.clientY-rect.top)*700/rect.height;if(phase==='play'&&!rolled){say('Hidh zaret së pari.');draw();return}if(mode==='road'){let idx=edges.findIndex(e=>e.owner<0&&dist(x,y,vertices[e.a],vertices[e.b])<12);if(idx<0)return;let e=edges[idx];if(!canRoad(e)){say('Rruga duhet të lidhet me rrjetin tënd.');draw();return}if(phase==='play'){let cost={forest:1,hill:1};if(!afford(cost)){say('Duhen 1 dru dhe 1 tullë.');draw();return}pay(cost)}e.owner=current;players[current].roads++;say(`${names[current]} ndërtoi rrugë.`);if(phase==='setup')setupAdvance()}else{let i=vertices.findIndex(v=>Math.hypot(x-v.x,y-v.y)<19);if(i<0)return;let v=vertices[i];if(mode==='settlement'){if(v.owner>=0||v.neighbors.some(n=>vertices[n].owner>=0)){say('Fshati duhet të jetë të paktën 2 segmente larg.');draw();return}if(phase==='play'){if(!connected(i)){say('Duhet lidhje me rrugën tënde.');draw();return}let cost={forest:1,hill:1,pasture:1,field:1};if(!afford(cost)){say('Fshat: 1 dru, 1 tullë, 1 dele, 1 grurë.');draw();return}pay(cost)}v.owner=current;v.level=1;players[current].vp++;if(phase==='setup'&&setupStep>=4){for(let tid of v.tiles){let t=tiles[tid];if(t.type!=='desert')players[current].res[t.type]++}}say(`${names[current]} ndërtoi fshat.`);if(phase==='setup')setupAdvance()}else if(mode==='city'){if(phase!=='play'||v.owner!==current||v.level!==1)return;let cost={field:2,mountain:3};if(!afford(cost)){say('Qytet: 2 grurë dhe 3 gurë.');draw();return}pay(cost);v.level=2;players[current].vp++;say(`${names[current]} ndërtoi qytet.`)}}if(players[current].vp>=Number(document.getElementById('target').value)){phase='finished';say(`🏆 ${names[current]} FITOI!`)}draw()}
function rollDice(){if(phase!=='play'||rolled)return;rolled=true;let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),sum=a+b;document.getElementById('dice').textContent=`🎲 ${a} + ${b} = ${sum}`;say(`${names[current]} hodhi ${sum}.`);if(sum===7){say('Doli 7! Grabitësi bllokon shkretëtirën në këtë prototip.')}else for(let [i,t] of tiles.entries()){if(t.num!==sum||i===robber)continue;for(let vid of t.vs){let v=vertices[vid];if(v.owner>=0){players[v.owner].res[t.type]+=v.level;say(`${names[v.owner]} mori ${v.level} ${t.type}.`)}}}draw()}
function endTurn(){if(phase!=='play'||!rolled){say('Hidh zaret para se të kalosh radhën.');draw();return}current=(current+1)%4;rolled=false;mode='road';document.getElementById('dice').textContent='';draw()}function trade(){if(phase!=='play'||!rolled)return;let p=players[current],source=Object.keys(p.res).find(k=>p.res[k]>=4);if(!source){say('Për tregti duhen 4 njësi të një burimi.');draw();return}let wanted=prompt('Merr 1 burim: forest, pasture, field, hill, mountain');if(!wanted||!(wanted in p.res)||wanted===source)return;p.res[source]-=4;p.res[wanted]++;say(`${p.name} shkëmbeu 4 ${source} për 1 ${wanted}.`);draw()}canvas.addEventListener('click',clickBoard);restart();</script></body></html>
